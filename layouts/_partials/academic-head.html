{{ $d := index hugo.Data (printf "portfolio_%s" .Language.Lang) }}
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ $d.site_title }}</title><meta name="description" content="{{ $d.description }}"><link rel="stylesheet" href="{{ "css/academic.css" | relURL }}"><meta name="theme-color" content="#234c73"><link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml"><link rel="canonical" href="{{ .Permalink }}">{{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.Locale }}" href="{{ .Permalink }}">{{ end }}</head>
